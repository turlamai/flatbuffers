name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Racket
        uses: Bogdanp/setup-racket@v1.12
        with:
          version: stable

      # flatc for the interop tests. Windows has no flatc package; the test
      # suite detects its absence at runtime and skips the interop tests,
      # running the pure-Racket round-trip suite only.
      - name: Install flatc (ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatbuffers-compiler

      - name: Install flatc (macOS)
        if: runner.os == 'macOS'
        run: brew install flatbuffers

      - name: Install package
        run: raco pkg install --auto --link "$(pwd)"

      - name: Run tests
        run: raco test -p flatbuffers
